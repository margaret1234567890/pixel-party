<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Party</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="progression.js"></script>
</head>
<body class="home-page">
  <div class="bg-grid"></div>
  <div class="bg-noise"></div>
  <header class="top-banner">
    <h1 class="logo">PIXEL PARTY</h1>
    <p class="tagline">Arcade break mode: ON</p>
  </header>

  <main class="hub">
    <section class="intro-card panel pulse-border">
      <h2>Choose A Game</h2>
      <p>Built for quick rounds between classes. Loud visuals, fast gameplay, zero boring UI.</p>
    </section>

    <section class="game-grid">
      <a class="game-tile tetris" href="tetris.html">
        <span class="tile-title">TETRIS</span>
        <span class="tile-desc">Stack, spin, survive.</span>
      </a>
      <a class="game-tile snake" href="snake.html">
        <span class="tile-title">SNAKE</span>
        <span class="tile-desc">Eat pixels. Get huge.</span>
      </a>
      <a class="game-tile game2048" href="2048.html">
        <span class="tile-title">2048</span>
        <span class="tile-desc">Merge your way up.</span>
      </a>
    </section>
    <div class="hub-shop-link"><a class="back-link" href="shop.html">VISIT STYLE SHOP</a></div>
  </main>

  <footer class="footer-note">Use keyboard controls for every game. Best played full-screen.</footer>
</body>
</html>
