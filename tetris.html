<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Party | Tetris</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="progression.js"></script>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-noise"></div>
  <header class="top-banner">
    <h1 class="logo">TETRIS</h1>
    <p class="tagline">Stack blocks. Clear lines. Stay alive.</p>
  </header>

  <main class="game-layout">
    <aside class="sidebar panel">
      <h2>Stats</h2>
      <div class="stat"><span>Score</span><span id="score">0</span></div>
      <div class="stat"><span>Lines</span><span id="lines">0</span></div>
      <div class="stat"><span>Level</span><span id="level">1</span></div>
      <div class="controls">
        <p>Controls:</p>
        <p>← → Move</p>
        <p>↑ Rotate</p>
        <p>↓ Soft Drop</p>
        <p>Space Hard Drop</p>
        <p>P Pause/Resume</p>
      </div>
      <button class="reset-btn" id="restartTetris">RESTART</button><br>
      <button class="reset-btn" id="pauseTetris">PAUSE</button><br>
      <a class="back-link" href="index.html">BACK TO HUB</a>
      <a class="back-link" href="shop.html">SHOP</a>
    </aside>

    <section class="game-panel panel" style="position:relative;">
      <canvas id="tetrisCanvas" width="300" height="600"></canvas>
      <div class="overlay" id="tetrisOverlay">GAME OVER</div>
      <div class="start-overlay" id="tetrisStartOverlay">
        <div class="start-card">
          <h3>TETRIS</h3>
          <p>Press Start when you are ready.</p>
          <button class="reset-btn" id="startTetris">START GAME</button>
        </div>
      </div>
    </section>
  </main>

  <script src="tetris.js"></script>
</body>
</html>
